[package]
name = "sentinel_core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Rust kernels for Prosumer Sentinel. The Python reference in sentinel/kernels is the source of truth."

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py312"] }
numpy = "0.30"
rayon = "1.10"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
