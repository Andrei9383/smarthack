# How the lab board runs this repository: checks and previews on every submitted card,
# training and evaluation runs on the GPU/CPU workers. Commands are read from the commit being run.
[project]
merge  = "auto"
submit = ["check", "preview"]
main   = ["preview"]
check  = "check"

# Merge gate: type checks + fast Python tests (slow tests run in rustcheck).
[runs.check]
setup   = "set -e; if [ -f package.json ]; then npm ci --no-audit --no-fund; fi; if [ -f requirements.txt ] || [ -d tests ]; then uv venv -q --python 3.12; fi; if [ -f requirements.txt ]; then uv pip install -q -r requirements.txt; fi; if [ -d tests ]; then uv pip install -q pytest; fi"
cmd     = "if [ -f package.json ]; then npm test; fi; if [ -d tests ]; then .venv/bin/python -m pytest -q -m 'not slow' -o faulthandler_timeout=300 --durations=15 tests; fi"
timeout = "15m"

# Serves the 600-home replay when its archive is committed, else demo/wattsentry.sqlite.
[runs.preview]
setup   = "set -e; npm ci --no-audit --no-fund && { [ -f demo/wattsentry.sqlite ] || python3 demo/fixtures/make_fixtures.py; } && { [ ! -f demo/wattsentry-homes600.sqlite.gz ] || python3 -c 'import gzip,shutil; shutil.copyfileobj(gzip.open(\"demo/wattsentry-homes600.sqlite.gz\"), open(\"demo/wattsentry-homes600.sqlite\",\"wb\"))'; } && npm run build"
cmd     = "if [ -f demo/wattsentry-homes600.sqlite ]; then export DATABASE_URL=file:$PWD/demo/wattsentry-homes600.sqlite; fi; npm start"
keep    = true

# Every ML run builds wattsentry._core first; a failed build falls back to the Python kernels.
# MODEL: pvnet | loadnet | sitehealth | windnbm (GPU), demandnet | windpower | windfailure | gridtwin (CPU).
[runs.train]
setup   = "uv venv -q --python 3.12 && uv pip install -q -r requirements.txt -r requirements-train.txt && { uv pip install -q maturin; sh rust/build.sh build; }"
cmd     = "sh rust/build.sh status && .venv/bin/python train.py --model ${MODEL:-pvnet}"
needs   = "gpu"
gpu_mem = "4G"
timeout = "2h"

# Replays 24 weeks in a process pool, then trains LightGBM per family; needs ~12 GB RAM.
[runs.judge]
setup   = "uv venv -q --python 3.12 && uv pip install -q -r requirements.txt && { uv pip install -q maturin; sh rust/build.sh build; }"
cmd     = "sh rust/build.sh status && .venv/bin/python train.py --model judge --bench-device --device auto"
needs   = "gpu"
gpu_mem = "12G"
timeout = "1h"

[runs.train_cpu]
setup   = "uv venv -q --python 3.12 && uv pip install -q -r requirements.txt && { uv pip install -q maturin; sh rust/build.sh build; }"
cmd     = "sh rust/build.sh status && .venv/bin/python train.py --model ${MODEL:-demandnet}"
needs   = "cpu"
timeout = "1h"

[runs.baseline]
setup   = "uv venv -q --python 3.12 && uv pip install -q -r requirements.txt && { uv pip install -q maturin; sh rust/build.sh build; }"
cmd     = "sh rust/build.sh status && .venv/bin/python eval.py --baselines"
needs   = "cpu"
timeout = "1h"

[runs.replay]
setup   = "uv venv -q --python 3.12 && uv pip install -q -r requirements.txt && { uv pip install -q maturin; sh rust/build.sh build; }"
cmd     = "sh rust/build.sh status && .venv/bin/python replay.py --policy baseline,sentinel --out $LAB_OUTPUT_DIR/wattsentry.sqlite"
needs   = "cpu"
timeout = "1h"

[runs.eval]
setup   = "uv venv -q --python 3.12 && uv pip install -q -r requirements.txt && { uv pip install -q maturin; sh rust/build.sh build; }"
cmd     = "sh rust/build.sh status && .venv/bin/python eval.py"
needs   = "gpu"
gpu_mem = "4G"
timeout = "30m"

# Imbalance replay on the 2025 test year -> imbalance.sqlite.
[runs.imbalance]
setup   = "uv venv -q --python 3.12 && uv pip install -q -r requirements.txt && { uv pip install -q maturin; sh rust/build.sh build; }"
cmd     = "sh rust/build.sh status && .venv/bin/python replay.py --mode imbalance --out $LAB_OUTPUT_DIR/imbalance.sqlite"
needs   = "gpu"
timeout = "1h"

# Rust kernels: equivalence tests, slow tests and the benchmark. Not part of the merge gate.
[runs.rustcheck]
setup   = "set -e; uv venv -q --python 3.12; uv pip install -q -r requirements.txt maturin pytest; sh rust/build.sh build"
cmd     = "sh rust/build.sh status --require && .venv/bin/python -m pytest -q -rs tests/test_kernels*.py && .venv/bin/python -m pytest -q -m slow --durations=15 tests && .venv/bin/python -m wattsentry.kernels.bench"
needs   = "cpu"
timeout = "30m"

[runs.bench]
setup   = "set -e; uv venv -q --python 3.12; uv pip install -q -r requirements.txt maturin; sh rust/build.sh build"
cmd     = "sh rust/build.sh status && .venv/bin/python -m wattsentry.kernels.bench"
needs   = "cpu"
timeout = "30m"

[leaderboard]
metric = "val_nmae"
better = "lower"
