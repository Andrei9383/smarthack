# lab.toml — how the lab runs this project (read from the commit being run).
#
# Where things run:
#   check, preview → the sandbox on the server (Node 22, Python, uv). Cards merge into main when the check passes.
#   train, eval    → the home GPUs (Python + uv, no Node). Cards proposed with --merge never are experiments.
# Python dependencies go in requirements.txt; uv installs them into .venv (cached per machine, so torch
# downloads once). Node dependencies: package.json + package-lock.json.

[project]
merge  = "auto"
submit = ["check", "preview"]   # what `lab submit` runs; ML cards: lab submit <card> --run train
main   = ["preview"]            # the shared app at app.<domain>, rebuilt after every merge
check  = "check"

[runs.check]
setup   = "set -e; if [ -f package.json ]; then npm ci --no-audit --no-fund; fi; if [ -f requirements.txt ] || [ -d tests ]; then uv venv -q --python 3.12; fi; if [ -f requirements.txt ]; then uv pip install -q -r requirements.txt; fi; if [ -d tests ]; then uv pip install -q pytest; fi"
cmd     = "if [ -f package.json ]; then npm test; fi; if [ -d tests ]; then .venv/bin/python -m pytest -q -m 'not slow' -o faulthandler_timeout=300 --durations=15 tests; fi"   # slow tests: rustcheck (#179)
timeout = "15m"

[runs.preview]
setup   = "set -e; npm ci --no-audit --no-fund && { [ -f demo/sentinel.sqlite ] || python3 demo/fixtures/make_fixtures.py; } && npm run build"
cmd     = "npm start"               # must listen on $HOST:$PORT (both set by the lab)
keep    = true

# ML runs (Stefan, #6). Light deps everywhere; torch only where a run trains. MODEL / POLICY can be overridden per
# submit with --cmd. Timing, metrics and the Rust kernels are described in team/infra.md.
# Every ML run builds sentinel._core (rust/build.sh never fails; a failed build falls back to Python) and prints
# LAB_METRIC rust_build_ok=0/1 first, so each run says which kernel backend it used (#132).
[runs.train]
setup   = "uv venv -q --python 3.12 && uv pip install -q -r requirements.txt -r requirements-train.txt && { uv pip install -q maturin; sh rust/build.sh build; }"
cmd     = "sh rust/build.sh status && .venv/bin/python train.py --model ${MODEL:-pvnet}"   # pvnet | loadnet | sitehealth | windnbm
needs   = "gpu"
gpu_mem = "4G"                      # only GPUs with this much memory take it (lab status lists them)
timeout = "2h"

[runs.train_cpu]
setup   = "uv venv -q --python 3.12 && uv pip install -q -r requirements.txt && { uv pip install -q maturin; sh rust/build.sh build; }"
cmd     = "sh rust/build.sh status && .venv/bin/python train.py --model ${MODEL:-demandnet}"   # demandnet | windpower | windfailure | gridtwin
needs   = "cpu"
timeout = "1h"

[runs.baseline]
setup   = "uv venv -q --python 3.12 && uv pip install -q -r requirements.txt && { uv pip install -q maturin; sh rust/build.sh build; }"
cmd     = "sh rust/build.sh status && .venv/bin/python eval.py --baselines"
needs   = "cpu"
timeout = "1h"

[runs.replay]
setup   = "uv venv -q --python 3.12 && uv pip install -q -r requirements.txt && { uv pip install -q maturin; sh rust/build.sh build; }"
cmd     = "sh rust/build.sh status && .venv/bin/python replay.py --policy baseline,sentinel --out $LAB_OUTPUT_DIR/sentinel.sqlite"
needs   = "cpu"
timeout = "1h"

[runs.eval]
setup   = "uv venv -q --python 3.12 && uv pip install -q -r requirements.txt && { uv pip install -q maturin; sh rust/build.sh build; }"
cmd     = "sh rust/build.sh status && .venv/bin/python eval.py"         # scores ONNX models with onnxruntime, so no torch
needs   = "gpu"
gpu_mem = "4G"
timeout = "30m"

# Imbalance replay (I6 #176, spec I step 8): profile / persistence / forecast_only / sentinel (+ sentinel_id) on the
# 2025 test year -> $LAB_OUTPUT_DIR/imbalance.sqlite + parquet + LAB_METRIC avoidable_cost_lei etc. needs gpu = the
# workers that hold the #10 window cache (the server OOMs building it).
[runs.imbalance]
setup   = "uv venv -q --python 3.12 && uv pip install -q -r requirements.txt && { uv pip install -q maturin; sh rust/build.sh build; }"
cmd     = "sh rust/build.sh status && .venv/bin/python replay.py --mode imbalance --out $LAB_OUTPUT_DIR/imbalance.sqlite"
needs   = "gpu"
timeout = "1h"

# Rust kernels (#48, team/infra.md §4). Not in `submit`/`check`: merges never depend on cargo. The setup uses
# cargo if present, else installs rustup into $HOME/.cargo; it prints the toolchain + build time (worker probe)
# and never fails on a build error. rustcheck then fails clearly if sentinel._core did not build; bench falls back
# to timing Python only. Kernel cards submit with: lab submit <card> --run check --run rustcheck
[runs.rustcheck]
setup   = "set -e; uv venv -q --python 3.12; uv pip install -q -r requirements.txt maturin pytest; sh rust/build.sh build"
cmd     = "sh rust/build.sh status --require && .venv/bin/python -m pytest -q -rs tests/test_kernels*.py && .venv/bin/python -m pytest -q -m slow --durations=15 tests && .venv/bin/python -m sentinel.kernels.bench"
needs   = "cpu"
timeout = "30m"

[runs.bench]
setup   = "set -e; uv venv -q --python 3.12; uv pip install -q -r requirements.txt maturin; sh rust/build.sh build"
cmd     = "sh rust/build.sh status && .venv/bin/python -m sentinel.kernels.bench"
needs   = "cpu"
timeout = "30m"

[leaderboard]
metric = "val_nmae"
better = "lower"
